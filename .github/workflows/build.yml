name: Build desktop apps

on:
  workflow_dispatch: # запуск вручную со страницы Actions
  push:
    branches: [main]
    tags: ['v*'] # или при пуше тега версии, например v0.1.0
  pull_request:
    branches: [main]

# по умолчанию GITHUB_TOKEN даёт только чтение — electron-builder не может
# создать релиз без явного contents: write (иначе падает на --publish always)
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false # падение одной платформы не должно отменять другую
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'macos-latest' && 'mac' || 'windows' }}-build
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/*.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-build'
          path: release-assets
          merge-multiple: true

      # Публикуем обе платформы одним шагом, чтобы параллельные jobs
      # не перезаписывали assets одного и того же релиза.
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
