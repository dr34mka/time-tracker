name: Build desktop apps

on:
  workflow_dispatch: # запуск вручную со страницы Actions
  push:
    tags: ['v*'] # или при пуше тега версии, например v0.1.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'macos-latest' && 'mac' || 'windows' }}-build
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
