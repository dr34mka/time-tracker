name: Build desktop apps

on:
  workflow_dispatch: # запуск вручную со страницы Actions
  push:
    tags: ['v*'] # или при пуше тега версии, например v0.1.0

# по умолчанию GITHUB_TOKEN даёт только чтение — electron-builder не может
# создать релиз без явного contents: write (иначе падает на --publish always)
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # падение одной платформы не должно отменять другую
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # при пуше тега v* — публикуем в GitHub Releases (фид для авто-уведомления
      # об обновлении); при ручном запуске без тега — просто собираем артефакты
      - run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os == 'macos-latest' && 'mac' || 'windows' }}-build
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
